<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Maktab Test | Odilxon</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="quiz.css">
</head>
<body>
    <div class="bg-glow"></div>
    <div class="particles" id="particles"></div>

    <header class="quiz-nav">
        <a href="index.html" class="back-btn">
            <i data-lucide="arrow-left"></i>
            <span data-i18n="back">Orqaga</span>
        </a>
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="uz">UZ</button>
            <button class="lang-btn" data-lang="ru">RU</button>
            <button class="lang-btn" data-lang="en">EN</button>
        </div>
    </header>

    <main class="quiz-container">
        <!-- Registration Section -->
        <section id="registrationArea" class="quiz-card animate-fade-in">
            <div class="quiz-header">
                <i data-lucide="user-plus" class="header-icon"></i>
                <h1 data-i18n="register">Ro'yxatdan o'tish</h1>
                <p data-i18n="register_desc">Ma'lumotlaringizni kiriting</p>
            </div>
            <div class="form-grid">
                <div class="input-group">
                    <input type="text" id="userName" placeholder="Ism" required>
                    <input type="text" id="userSurname" placeholder="Familiya" required>
                    <input type="number" id="userId" placeholder="ID raqami (1, 2...)" min="1" required>
                </div>
                <p id="regError" class="error-msg" style="display: none;"></p>
                <button class="restart-btn" id="startRegBtn" data-i18n="start_quiz">Testni boshlash</button>
            </div>
        </section>

        <!-- Level Selection -->
        <section id="levelSelection" class="quiz-card animate-fade-in" style="display: none;">
            <div class="quiz-header">
                <i data-lucide="car" class="header-icon"></i>
                <h1 data-i18n="quiz_title">Auto Maktab Test</h1>
                <p data-i18n="quiz_desc">Bilimingizni sinab ko'ring!</p>
            </div>
            
            <div class="level-grid">
                <button class="level-btn easy" data-level="easy">
                    <span class="level-icon">🟢</span>
                    <div class="level-info">
                        <h3 data-i18n="easy">Oson</h3>
                        <p data-i18n="easy_desc">Yangi boshlovchilar uchun</p>
                    </div>
                </button>
                <button class="level-btn medium" data-level="medium">
                    <span class="level-icon">🟡</span>
                    <div class="level-info">
                        <h3 data-i18n="medium">O'rtacha</h3>
                        <p data-i18n="medium_desc">Tajribali haydovchilar uchun</p>
                    </div>
                </button>
                <button class="level-btn hard" data-level="hard">
                    <span class="level-icon">🔴</span>
                    <div class="level-info">
                        <h3 data-i18n="hard">Qiyin</h3>
                        <p data-i18n="hard_desc">Professionallar uchun</p>
                    </div>
                </button>
            </div>
        </section>

        <!-- Quiz Area -->
        <section id="quizArea" class="quiz-card" style="display: none;">
            <div class="quiz-progress">
                <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
                <div class="quiz-stats">
                    <span id="questionCounter">1/20</span>
                    <span id="timer">00:00</span>
                </div>
            </div>
            
            <div id="questionContainer">
                <div id="questionImageContainer" class="question-image-container"></div>
                <h2 id="questionText" class="question-text">Savol yuklanmoqda...</h2>
                <div id="optionsContainer" class="options-grid">
                    <!-- Options injected here -->
                </div>
            </div>
        </section>

        <!-- Results Screen -->
        <section id="resultArea" class="quiz-card" style="display: none;">
            <div class="result-header">
                <i data-lucide="trophy" class="trophy-icon"></i>
                <h2 data-i18n="finished">Natija</h2>
            </div>
            <div class="score-circle">
                <span id="finalScore">0</span>
                <small>/20</small>
            </div>
            <p id="finalTime" class="final-time"></p>
            <p id="resultMessage" class="result-message"></p>
            <button class="restart-btn" id="restartBtn" data-i18n="restart">Qayta urinish</button>
        </section>
    </main>

    <script src="quiz.js"></script>
</body>
</html>
